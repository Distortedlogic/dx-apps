_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_exclude:
  - "{% if not fullstack %}apps/**/src/api/**{% else %}.copier-never{% endif %}"
  - "{% if 'database' not in capabilities %}apps/**/src/api/db/**{% else %}.copier-never{% endif %}"
  - "{% if 'database' not in capabilities %}apps/**/src/api/server_fns/records.rs*{% else %}.copier-never{% endif %}"
  - "{% if 'database' not in capabilities %}diesel.toml*{% else %}.copier-never{% endif %}"
  - "{% if 'database' not in capabilities %}migrations/**{% else %}.copier-never{% endif %}"
  - "{% if 'authentication' not in capabilities %}apps/**/src/api/auth/**{% else %}.copier-never{% endif %}"
  - "{% if 'authentication' not in capabilities %}apps/**/src/api/server_fns/auth.rs*{% else %}.copier-never{% endif %}"
  - "{% if 'websocket' not in capabilities %}apps/**/src/api/websocket/**{% else %}.copier-never{% endif %}"
  - "{% if 'charting' not in capabilities %}apps/**/src/components/**{% else %}.copier-never{% endif %}"
_tasks:
  - pnpm install

project_name:
  type: str
  help: Application display name
  default: My Dioxus App
  validator: >-
    {% if not (project_name | trim) %}
    Enter an application name.
    {% elif not (project_name | regex_search('^[A-Za-z]')) %}
    Start the application name with an ASCII letter.
    {% endif %}

project_slug:
  type: str
  default: "{{ project_name | lower | regex_replace('[^a-z0-9]+', '-') | trim('-') }}"
  when: false

targets:
  type: str
  help: Dioxus render targets
  choices:
    Web: web
    Desktop: desktop
    Mobile: mobile
  multiselect: true
  default:
    - web
  validator: >-
    {% if not targets %}
    Select at least one render target.
    {% endif %}

fullstack:
  type: bool
  help: Include a Dioxus full-stack server
  default: false

capabilities:
  type: str
  help: Application capabilities
  choices:
    Database: database
    Authentication: authentication
    WebSocket: websocket
    Charting: charting
  multiselect: true
  default: []
  validator: >-
    {% if not fullstack and ("database" in capabilities or "authentication" in capabilities or "websocket" in capabilities) %}
    Database, authentication, and WebSocket capabilities require the full-stack server.
    {% elif "authentication" in capabilities and "database" not in capabilities %}
    Authentication requires the database capability.
    {% endif %}

_message_after_copy: |
  {{ project_name }} is ready. Run `just --list` in the generated directory.
