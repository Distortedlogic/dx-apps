_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Application display name
  default: My Dioxus App
  validator: >-
    {% if not (project_name | trim) %}
    Enter an application name.
    {% elif not (project_name | regex_search('^[A-Za-z]')) %}
    Start the application name with an ASCII letter.
    {% endif %}

app_type:
  type: str
  help: Dioxus application type
  choices:
    Web: web
    Full-stack web: fullstack
    Desktop: desktop
    Mobile: mobile
  default: web

mobile_target:
  type: str
  help: Default mobile development target
  choices:
    Android: android
    iOS: ios
  default: android
  when: "{{ app_type == 'mobile' }}"

_message_after_copy: |
  {{ project_name }} is ready. Run `just serve` in the generated directory.
