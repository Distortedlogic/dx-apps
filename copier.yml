_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

project_name:
  type: str
  help: Application display name
  default: My Dioxus App
  validator: "{% if not (project_name | trim) %}Enter an application name.{% endif %}"

project_slug:
  type: str
  help: Cargo package and Dioxus application name
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) %}
    Use lowercase ASCII letters, numbers, and single hyphens. Start with a letter.
    {% endif %}

project_description:
  type: str
  help: Short application description
  default: A Dioxus application

app_type:
  type: str
  help: Dioxus application type
  choices:
    Web: web
    Full-stack web: fullstack
    Desktop: desktop
    Mobile: mobile
  default: web

use_router:
  type: bool
  help: Include Dioxus Router with home and not-found routes
  default: true

mobile_target:
  type: str
  help: Default mobile development target
  choices:
    Android: android
    iOS: ios
  default: android
  when: "{{ app_type == 'mobile' }}"

bundle_identifier:
  type: str
  help: Reverse-domain bundle identifier
  default: "com.entropybender.{{ project_slug | replace('-', '') }}"
  validator: >-
    {% if not (bundle_identifier | regex_search('^[A-Za-z0-9]+(?:\.[A-Za-z0-9-]+)+$')) %}
    Use a reverse-domain identifier such as com.example.app.
    {% endif %}
  when: "{{ app_type in ['desktop', 'mobile'] }}"

_message_after_copy: |
  {{ project_name }} is ready. Run `just serve` in the generated directory.
